<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Aset - ASIT Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #efede8;
  --border: rgba(0,0,0,0.08);
  --text: #111110;
  --text2: #6b6860;
  --text3: #b0ada8;
  --accent: #111110;
  --green: #1a7f4b;
  --green-bg: #dcf4e8;
  --amber: #8a5c0a;
  --amber-bg: #fef1d4;
  --red: #c0271f;
  --red-bg: #fde8e7;
  --r: 16px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  opacity: 0;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 32px; height: 60px;
  background: rgba(247,246,243,0.94);
  backdrop-filter: blur(24px) saturate(1.3);
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--text2);
  text-decoration: none; background: none; border: none;
  cursor: pointer; padding: 6px 0;
  transition: color .15s;
}
.back-btn:hover { color: var(--text); }
.back-btn svg { transition: transform .2s; }
.back-btn:hover svg { transform: translateX(-3px); }
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 18px; color: var(--text2); letter-spacing: -0.3px;
}
.logo em { font-style: italic; }
.nav-spacer { flex: 1; }
.nav-no {
  font-size: 11px; color: var(--text2);
  padding: 4px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  letter-spacing: 0.8px; font-weight: 500;
}

/* ── MAIN LAYOUT ── */
.page {
  max-width: 1040px;
  margin: 0 auto;
  padding: 40px 32px 80px;
}

/* ── HERO SPLIT: image left, info right ── */
.hero-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 36px;
  align-items: start;
}

/* ── IMAGE BOX 1:1 ── */
.img-box {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
}
.img-box img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .8s ease;
}
.img-box:hover img { transform: scale(1.04); }
.img-box .img-status {
  position: absolute; top: 14px; left: 14px;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 30px;
  font-size: 11px; font-weight: 500;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.3);
}
.img-box .img-status::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
}

/* ── RIGHT PANEL ── */
.right-panel {
  display: flex; flex-direction: column; gap: 0;
  padding-top: 4px;
}

.asset-no {
  font-size: 11px; color: var(--text3);
  letter-spacing: 1.4px; font-weight: 600;
  text-transform: uppercase; margin-bottom: 10px;
}

.asset-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(28px, 3.5vw, 44px);
  line-height: 1.08;
  letter-spacing: -1.2px;
  color: var(--text);
  margin-bottom: 16px;
}
.asset-title em { font-style: italic; color: var(--text2); }

.tag-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 28px;
}
.tag-pill {
  padding: 5px 13px; border-radius: 30px;
  font-size: 11px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
}

/* ── INFO CARDS ── */
.info-stack {
  display: flex; flex-direction: column; gap: 10px;
}
.info-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  transition: background .15s;
}
.info-card:hover { background: var(--surface2); }
.info-card.full { grid-column: 1 / -1; }
.info-key {
  font-size: 10px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.9px;
  font-weight: 600; margin-bottom: 5px;
}
.info-val {
  font-size: 14px; font-weight: 500; color: var(--text);
  line-height: 1.4;
}
.info-val.light { font-weight: 400; color: var(--text2); }

/* ── STATUS BADGE ── */
.s-aktif { background: rgba(220,244,232,0.9); color: var(--green); }
.s-aktif::before, .s-aktif.dot::before { background: var(--green); animation: pulse 2s infinite; }
.s-maintenance { background: rgba(254,241,212,0.9); color: var(--amber); }
.s-maintenance::before { background: var(--amber); }
.s-retired { background: rgba(253,232,231,0.9); color: var(--red); }
.s-retired::before { background: var(--red); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 30px;
  font-size: 12px; font-weight: 500;
}
.status-badge::before {
  content:''; width:6px; height:6px; border-radius:50%;
}

/* ── DESCRIPTION ── */
.desc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px 28px 30px;
  margin-bottom: 32px;
}
.section-label {
  font-size: 10px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1.2px;
  font-weight: 600; margin-bottom: 14px;
}
.desc-divider { height: 1px; background: var(--border); margin-bottom: 18px; }
.desc-text {
  font-size: 14px; color: var(--text2);
  line-height: 1.9; font-weight: 300;
}

/* ── BACK FOOTER ── */
.back-footer { text-align: center; padding-top: 4px; }
.back-footer a {
  font-size: 13px; color: var(--text2);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color .15s;
}
.back-footer a:hover { color: var(--text); }

/* ── NOT FOUND ── */
.not-found {
  max-width: 480px; margin: 80px auto;
  text-align: center; padding: 0 40px;
}
.nf-icon { font-size: 60px; margin-bottom: 20px; }
.not-found h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 36px; letter-spacing: -1px; margin-bottom: 12px;
}
.not-found p { color: var(--text2); line-height: 1.8; margin-bottom: 28px; }
.btn-home {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 28px; background: var(--accent);
  color: var(--bg); border-radius: 12px;
  font-size: 13px; font-weight: 500;
  text-decoration: none; transition: opacity .15s;
}
.btn-home:hover { opacity: .85; }

/* ── MOBILE ── */
@media (max-width: 700px) {
  nav { padding: 0 16px; }
  .page { padding: 24px 16px 60px; }
  .hero-split { grid-template-columns: 1fr; gap: 20px; }
  .img-box { max-width: 100%; }
  .info-row { grid-template-columns: 1fr; }
  .asset-title { font-size: 30px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Kembali
  </a>
  <div class="nav-spacer"></div>
  <div class="logo">ASIT<em>Management</em></div>
  <div class="nav-no" id="nav-no">—</div>
</nav>

<div id="main-content"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="assets.js"></script>
<script>
function getParam(k) { return new URLSearchParams(location.search).get(k); }

function statusClass(s) {
  return { 'Aktif':'s-aktif', 'Maintenance':'s-maintenance', 'Retired':'s-retired' }[s] || 's-aktif';
}

function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); }
  catch { return d; }
}

function emojiFor(name) {
  const map = { laptop:'💻', printer:'🖨', ac:'❄️', proyektor:'📽', iphone:'📱', meja:'🪑', monitor:'🖥', kamera:'📷' };
  const n = name.toLowerCase();
  for (const [k,v] of Object.entries(map)) if (n.includes(k)) return v;
  return '📦';
}

function renderDetail(asset) {
  document.title = `${asset.name} · ASIT Management`;
  document.getElementById('nav-no').textContent = asset.no;

  const sc = statusClass(asset.status);
  const imgHtml = asset.img
    ? `<img src="${asset.img}" alt="${asset.name}" onerror="this.style.display='none'">`
    : emojiFor(asset.name);

  document.getElementById('main-content').innerHTML = `
    <div class="page">

      <div class="hero-split">

        <!-- IMAGE 1:1 -->
        <div class="img-box">
          ${imgHtml}
          <span class="img-status ${sc}">${asset.status}</span>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
          <div class="asset-no">${asset.no}</div>
          <h1 class="asset-title">${asset.name}</h1>

          ${(asset.tags||[]).length ? `
            <div class="tag-row">
              ${asset.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('')}
            </div>` : ''}

          <div class="info-stack">
            <div class="info-row">
              <div class="info-card">
                <div class="info-key">Pemilik / PIC</div>
                <div class="info-val">${asset.owner}</div>
              </div>
              <div class="info-card">
                <div class="info-key">Departemen</div>
                <div class="info-val light">${asset.dept || '—'}</div>
              </div>
            </div>
            <div class="info-card full">
              <div class="info-key">Lokasi Fisik</div>
              <div class="info-val light">${asset.location || '—'}</div>
            </div>
            <div class="info-row">
              <div class="info-card">
                <div class="info-key">Tanggal Perolehan</div>
                <div class="info-val light">${formatDate(asset.date)}</div>
              </div>
              <div class="info-card">
                <div class="info-key">Status Kondisi</div>
                <div class="info-val">
                  <span class="status-badge ${sc}">${asset.status}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- DESCRIPTION -->
      <div class="desc-card">
        <div class="section-label">Deskripsi Aset</div>
        <div class="desc-divider"></div>
        <p class="desc-text">${asset.desc || 'Tidak ada deskripsi untuk aset ini.'}</p>
      </div>

      <div class="back-footer">
        <a href="index.html">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Lihat semua aset
        </a>
      </div>

    </div>
  `;

  anime.timeline({ easing: 'easeOutExpo' })
    .add({ targets: 'body',        opacity:[0,1],              duration:300 })
    .add({ targets: 'nav',         translateY:[-8,0], opacity:[0,1], duration:500 }, 50)
    .add({ targets: '.img-box',    scale:[.96,1], opacity:[0,1], duration:700 }, 120)
    .add({ targets: '.asset-no',   translateY:[8,0], opacity:[0,1], duration:400 }, 280)
    .add({ targets: '.asset-title',translateY:[16,0],opacity:[0,1], duration:600 }, 340)
    .add({ targets: '.tag-row',    translateY:[8,0], opacity:[0,1], duration:400 }, 460)
    .add({ targets: '.info-card',  translateY:[10,0],opacity:[0,1], delay:anime.stagger(55), duration:400 }, 520)
    .add({ targets: '.desc-card',  translateY:[8,0], opacity:[0,1], duration:400 }, 750)
    .add({ targets: '.back-footer',opacity:[0,1],              duration:300 }, 900);
}

function renderNotFound(id) {
  document.title = 'Tidak Ditemukan - ASIT Management';
  document.getElementById('main-content').innerHTML = `
    <div class="not-found">
      <div class="nf-icon">📭</div>
      <h2>Aset tidak ditemukan</h2>
      <p>ID <strong>${id || '?'}</strong> tidak ada dalam database.<br>Periksa kembali QR Code atau hubungi admin.</p>
      <a href="index.html" class="btn-home">← Kembali ke Dashboard</a>
    </div>
  `;
  anime({ targets:'body', opacity:[0,1], duration:400, easing:'easeOutExpo' });
}

const id = getParam('id');
if (id) {
  const asset = ASSETS.find(a => a.id === id);
  if (asset) renderDetail(asset);
  else renderNotFound(id);
} else {
  renderNotFound(null);
}
</script>
</body>
</html>
