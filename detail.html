<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Aset - ASIT Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #efede8;
  --border: rgba(0,0,0,0.09);
  --text: #111110;
  --text2: #6b6860;
  --text3: #b0ada8;
  --accent: #111110;
  --green: #1a7f4b;
  --green-bg: #dcf4e8;
  --amber: #8a5c0a;
  --amber-bg: #fef1d4;
  --red: #c0271f;
  --red-bg: #fde8e7;
  --r: 16px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  opacity: 0;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 40px; height: 64px;
  background: rgba(247,246,243,0.92);
  backdrop-filter: blur(24px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--text2);
  text-decoration: none; background: none; border: none;
  cursor: pointer; padding: 6px 0;
  transition: color .15s;
}
.back-btn:hover { color: var(--text); }
.back-btn svg { transition: transform .2s; }
.back-btn:hover svg { transform: translateX(-3px); }
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; color: var(--text2);
  letter-spacing: -0.3px;
}
.logo em { font-style: italic; }
.nav-spacer { flex: 1; }
.nav-no {
  font-size: 11px; color: var(--text2);
  padding: 4px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  letter-spacing: 0.8px;
  font-weight: 500;
}

/* ── HERO ── */
.hero-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 21/9;
  max-height: 520px;
  overflow: hidden;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 100px;
}
.hero-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .8s ease;
}
.hero-wrap:hover img { transform: scale(1.03); }

.hero-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(
    to top,
    rgba(17,17,16,0.65) 0%,
    rgba(17,17,16,0.2) 40%,
    transparent 70%
  );
}

.hero-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 40px 56px 44px;
}

.hero-no {
  font-size: 11px; color: rgba(255,255,255,0.6);
  letter-spacing: 1.5px; font-weight: 500;
  text-transform: uppercase; margin-bottom: 8px;
}

.hero-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(36px, 5vw, 64px);
  line-height: 1.05;
  letter-spacing: -1.5px;
  color: #ffffff;
  margin-bottom: 14px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.hero-title em { font-style: italic; opacity: 0.8; }

.hero-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 30px;
  font-size: 12px; font-weight: 500;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.25);
}
.status-pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
}
.s-aktif { background: rgba(220,244,232,0.85); color: var(--green); }
.s-aktif::before { background: var(--green); animation: pulse 2s infinite; }
.s-maintenance { background: rgba(254,241,212,0.85); color: var(--amber); }
.s-maintenance::before { background: var(--amber); }
.s-retired { background: rgba(253,232,231,0.85); color: var(--red); }
.s-retired::before { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
}

.hero-tag {
  padding: 5px 12px; border-radius: 30px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 11px; color: rgba(255,255,255,0.85);
  font-weight: 500;
}

/* ── LAYOUT ── */
.page { max-width: 900px; margin: 0 auto; padding: 48px 40px 80px; }

/* ── INFO SECTION ── */
.section-label {
  font-size: 11px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1.2px;
  font-weight: 600; margin-bottom: 16px;
}

.info-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin-bottom: 32px;
}
.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 20px 22px;
  transition: background .15s;
}
.info-card:hover { background: var(--surface2); }
.info-card.full { grid-column: 1/-1; }
.info-key {
  font-size: 11px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.8px;
  font-weight: 500; margin-bottom: 6px;
}
.info-val {
  font-size: 15px; font-weight: 500; color: var(--text);
  line-height: 1.4;
}
.info-val.light { font-weight: 400; color: var(--text2); }

/* ── STATUS CARD ── */
.status-inline {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 30px;
  font-size: 12px; font-weight: 500;
}
.status-inline::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
}

/* ── DESCRIPTION ── */
.desc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 28px 32px;
  margin-bottom: 32px;
}
.desc-divider { height: 1px; background: var(--border); margin: 12px 0 20px; }
.desc-text {
  font-size: 14px; color: var(--text2);
  line-height: 1.9; font-weight: 300;
}

/* ── BACK FOOTER ── */
.back-footer {
  text-align: center; padding-top: 8px;
}
.back-footer a {
  font-size: 13px; color: var(--text2);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color .15s;
}
.back-footer a:hover { color: var(--text); }

/* ── HERO EMOJI FALLBACK ── */
.emoji-hero {
  font-size: 100px; display: flex;
  align-items: center; justify-content: center;
  width: 100%; height: 100%;
  background: var(--surface2);
}

/* ── NOT FOUND ── */
.not-found {
  max-width: 480px; margin: 80px auto; text-align: center; padding: 0 40px;
}
.nf-icon { font-size: 60px; margin-bottom: 20px; }
.not-found h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 36px; letter-spacing: -1px; margin-bottom: 12px;
}
.not-found p { color: var(--text2); line-height: 1.8; margin-bottom: 28px; }
.btn-home {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 28px; background: var(--accent);
  color: var(--bg); border-radius: 12px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  text-decoration: none; transition: opacity .15s;
}
.btn-home:hover { opacity: 0.85; }

@media (max-width: 640px) {
  nav { padding: 0 16px; }
  .hero-content { padding: 24px 20px 28px; }
  .hero-title { font-size: 28px; }
  .page { padding: 28px 16px 60px; }
  .info-grid { grid-template-columns: 1fr; }
  .info-card.full { grid-column: 1; }
  .hero-wrap { aspect-ratio: 16/9; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Kembali
  </a>
  <div class="nav-spacer"></div>
  <div class="logo">ASIT<em>Management</em></div>
  <div class="nav-no" id="nav-no">—</div>
</nav>

<div id="main-content"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="assets.js"></script>
<script>
function getParam(k) { return new URLSearchParams(location.search).get(k); }

function statusClass(s) {
  return { 'Aktif':'s-aktif', 'Maintenance':'s-maintenance', 'Retired':'s-retired' }[s] || 's-aktif';
}

function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); }
  catch { return d; }
}

function heroHtml(asset) {
  if (asset.img) {
    return `
      <div class="hero-wrap">
        <img src="${asset.img}" alt="${asset.name}" onerror="this.style.display='none';this.parentElement.querySelector('.emoji-hero').style.display='flex'">
        <div class="emoji-hero" style="display:none;position:absolute;inset:0"></div>
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-no">${asset.no}</div>
          <h1 class="hero-title">${asset.name}</h1>
          <div class="hero-row">
            <span class="status-pill ${statusClass(asset.status)}">${asset.status}</span>
            ${(asset.tags||[]).map(t=>`<span class="hero-tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    `;
  }
  const map = { laptop:'💻', printer:'🖨', ac:'❄️', proyektor:'📽', iphone:'📱', meja:'🪑', monitor:'🖥', kamera:'📷' };
  const n = asset.name.toLowerCase();
  let emoji = '📦';
  for (const [k,v] of Object.entries(map)) if (n.includes(k)) { emoji=v; break; }

  return `
    <div class="hero-wrap" style="background:#efede8;">
      <div style="font-size:120px;z-index:0;">${emoji}</div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-no">${asset.no}</div>
        <h1 class="hero-title">${asset.name}</h1>
        <div class="hero-row">
          <span class="status-pill ${statusClass(asset.status)}">${asset.status}</span>
          ${(asset.tags||[]).map(t=>`<span class="hero-tag">${t}</span>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderDetail(asset) {
  document.title = `${asset.name} · ASIT Management`;
  document.getElementById('nav-no').textContent = asset.no;

  document.getElementById('main-content').innerHTML = `
    ${heroHtml(asset)}

    <div class="page">

      <div class="section-label">Informasi Aset</div>
      <div class="info-grid">
        <div class="info-card">
          <div class="info-key">Pemilik / PIC</div>
          <div class="info-val">${asset.owner}</div>
        </div>
        <div class="info-card">
          <div class="info-key">Departemen</div>
          <div class="info-val light">${asset.dept || '—'}</div>
        </div>
        <div class="info-card full">
          <div class="info-key">Lokasi Fisik</div>
          <div class="info-val light">${asset.location || '—'}</div>
        </div>
        <div class="info-card">
          <div class="info-key">Tanggal Perolehan</div>
          <div class="info-val light">${formatDate(asset.date)}</div>
        </div>
        <div class="info-card">
          <div class="info-key">Status Kondisi</div>
          <div class="info-val">
            <span class="status-inline ${statusClass(asset.status)}">${asset.status}</span>
          </div>
        </div>
      </div>

      <div class="desc-card">
        <div class="section-label">Deskripsi Aset</div>
        <div class="desc-divider"></div>
        <p class="desc-text">${asset.desc || 'Tidak ada deskripsi untuk aset ini.'}</p>
      </div>

      <div class="back-footer">
        <a href="index.html">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Lihat semua aset
        </a>
      </div>

    </div>
  `;

  anime.timeline({ easing: 'easeOutExpo' })
    .add({ targets: 'body', opacity:[0,1], duration:300 })
    .add({ targets: 'nav', translateY:[-8,0], opacity:[0,1], duration:500 }, 50)
    .add({ targets: '.hero-wrap', opacity:[0,1], duration:700 }, 100)
    .add({ targets: '.hero-no', translateY:[10,0], opacity:[0,1], duration:400 }, 300)
    .add({ targets: '.hero-title', translateY:[20,0], opacity:[0,1], duration:600 }, 380)
    .add({ targets: '.hero-row', translateY:[8,0], opacity:[0,1], duration:400 }, 520)
    .add({ targets: '.section-label', opacity:[0,1], duration:300 }, 650)
    .add({ targets: '.info-card', translateY:[12,0], opacity:[0,1], delay:anime.stagger(60), duration:400 }, 700)
    .add({ targets: '.desc-card', translateY:[10,0], opacity:[0,1], duration:400 }, 880)
    .add({ targets: '.back-footer', opacity:[0,1], duration:300 }, 1000);
}

function renderNotFound(id) {
  document.title = 'Tidak Ditemukan - ASIT Management';
  document.getElementById('main-content').innerHTML = `
    <div class="not-found">
      <div class="nf-icon">📭</div>
      <h2>Aset tidak ditemukan</h2>
      <p>ID <strong>${id || '?'}</strong> tidak ada dalam database.<br>Periksa kembali QR Code atau hubungi admin.</p>
      <a href="index.html" class="btn-home">← Kembali ke Dashboard</a>
    </div>
  `;
  anime({ targets:'body', opacity:[0,1], duration:400, easing:'easeOutExpo' });
}

const id = getParam('id');
if (id) {
  const asset = ASSETS.find(a => a.id === id);
  if (asset) renderDetail(asset);
  else renderNotFound(id);
} else {
  renderNotFound(null);
}
</script>
</body>
</html>
