<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIT Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #efede8;
  --border: rgba(0,0,0,0.09);
  --text: #111110;
  --text2: #6b6860;
  --text3: #b0ada8;
  --accent: #111110;
  --green: #1a7f4b;
  --green-bg: #dcf4e8;
  --amber: #8a5c0a;
  --amber-bg: #fef1d4;
  --red: #c0271f;
  --red-bg: #fde8e7;
  --r: 16px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  opacity: 0;
  transition: opacity .3s;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 40px; height: 64px;
  background: rgba(247,246,243,0.92);
  backdrop-filter: blur(24px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: -0.5px;
}
.logo em { font-style: italic; color: var(--text2); }

.nav-spacer { flex: 1; }

.nav-search {
  position: relative;
  display: flex; align-items: center;
}
.search-icon {
  position: absolute; left: 12px;
  color: var(--text3); pointer-events: none;
  display: flex; align-items: center;
}
.nav-search input {
  padding: 8px 16px 8px 38px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  width: 240px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.nav-search input::placeholder { color: var(--text3); }
.nav-search input:focus {
  border-color: rgba(0,0,0,0.25);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}

.view-toggle {
  display: flex; gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}
.view-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer;
  border-radius: 5px; color: var(--text3);
  transition: all .15s;
}
.view-btn.active { background: var(--surface); color: var(--text); }
.view-btn svg { width: 14px; height: 14px; }

/* ── HEADER ── */
.header {
  padding: 56px 40px 40px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px;
}
.header-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(42px, 6vw, 68px);
  line-height: 1;
  letter-spacing: -2px;
  color: var(--text);
}
.header-title em { font-style: italic; color: var(--text2); }
.header-sub {
  font-size: 13px; color: var(--text3);
  margin-top: 10px;
  font-weight: 300;
  letter-spacing: 0.2px;
}

/* ── STATS ── */
.stats-row {
  display: flex; gap: 12px;
  padding: 0 40px 32px;
}
.stat-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 24px;
  transition: transform .2s;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-n {
  font-family: 'DM Serif Display', serif;
  font-size: 44px; line-height: 1;
  letter-spacing: -2px;
}
.stat-n.c-green { color: var(--green); }
.stat-n.c-amber { color: var(--amber); }
.stat-n.c-red { color: var(--red); }
.stat-l {
  font-size: 11px; color: var(--text3);
  margin-top: 5px; letter-spacing: 0.8px;
  text-transform: uppercase; font-weight: 500;
}

/* ── FILTER BAR ── */
.filter-bar {
  display: flex; gap: 6px; align-items: center;
  padding: 0 40px; margin-bottom: 28px;
  overflow-x: auto; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 16px; border-radius: 30px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; color: var(--text2);
  white-space: nowrap;
  transition: all .15s;
  user-select: none;
}
.chip:hover { border-color: rgba(0,0,0,0.2); color: var(--text); }
.chip.active { background: var(--accent); color: #f7f6f3; border-color: var(--accent); }

/* ── GRID ── */
.grid-container {
  padding: 0 40px 80px;
}

.asset-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(280px, 2fr));
  gap: 20px;
}

/* ── ASSET CARD ── */
.asset-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  text-decoration: none; color: inherit;
  display: block;
}
.asset-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
}

.card-img {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 60px;
  overflow: hidden;
  position: relative;
}
.card-img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .5s ease;
}
.asset-card:hover .card-img img { transform: scale(1.05); }

.card-status {
  position: absolute; top: 12px; left: 12px;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  backdrop-filter: blur(10px);
}
.card-status::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
}
.s-aktif { background: rgba(220,244,232,0.9); color: var(--green); }
.s-aktif::before { background: var(--green); animation: pulse 2s infinite; }
.s-maintenance { background: rgba(254,241,212,0.9); color: var(--amber); }
.s-maintenance::before { background: var(--amber); }
.s-retired { background: rgba(253,232,231,0.9); color: var(--red); }
.s-retired::before { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
}

.card-body { padding: 18px 20px 20px; }
.card-no {
  font-size: 11px; color: var(--text3);
  letter-spacing: 0.8px; margin-bottom: 4px;
  font-weight: 500;
}
.card-name {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; line-height: 1.2;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
}
.card-meta {
  display: flex; flex-direction: column; gap: 4px;
}
.card-owner {
  font-size: 12px; color: var(--text2);
  display: flex; align-items: center; gap: 6px;
}
.card-owner svg { color: var(--text3); flex-shrink: 0; }
.card-dept {
  font-size: 11px; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.card-dept svg { flex-shrink: 0; }
.card-tags {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px;
}
.tag {
  padding: 3px 9px; border-radius: 4px;
  background: var(--surface2); color: var(--text3);
  font-size: 10px; font-weight: 500;
  border: 1px solid var(--border);
  letter-spacing: 0.3px;
}

.card-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2);
}
.card-loc { font-size: 11px; color: var(--text3); }
.card-arrow {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); font-size: 14px;
  transition: background .15s, transform .15s;
}
.asset-card:hover .card-arrow {
  background: var(--accent); color: #f7f6f3;
  transform: translateX(2px);
}

/* ── LIST VIEW ── */
.asset-list { display: flex; flex-direction: column; gap: 1px; }
.list-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 16px;
  cursor: pointer; text-decoration: none; color: inherit;
  transition: background .15s, transform .15s;
  margin-bottom: 8px;
}
.list-item:hover { background: var(--surface2); transform: translateX(4px); }
.list-thumb {
  width: 56px; height: 56px; border-radius: 10px;
  overflow: hidden; flex-shrink: 0;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.list-thumb img { width: 100%; height: 100%; object-fit: cover; }
.list-info { flex: 1; min-width: 0; }
.list-name { font-weight: 600; font-size: 14px; }
.list-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.list-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.list-loc { font-size: 11px; color: var(--text3); }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.badge-aktif { background: var(--green-bg); color: var(--green); }
.badge-aktif::before { background: var(--green); }
.badge-maintenance { background: var(--amber-bg); color: var(--amber); }
.badge-maintenance::before { background: var(--amber); }
.badge-retired { background: var(--red-bg); color: var(--red); }
.badge-retired::before { background: var(--red); }
.list-arrow { color: var(--text3); }

/* ── EMPTY ── */
.empty {
  grid-column: 1/-1;
  padding: 80px; text-align: center; color: var(--text2);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }

/* ── FOOTER ── */
footer {
  text-align: center; padding: 24px;
  font-size: 11px; color: var(--text3);
  border-top: 1px solid var(--border);
  letter-spacing: 0.5px;
}

@media (max-width: 768px) {
  nav { padding: 0 16px; }
  .header { padding: 32px 16px 24px; }
  .stats-row { padding: 0 16px 24px; flex-wrap: wrap; }
  .filter-bar { padding: 0 16px; }
  .grid-container { padding: 0 16px 60px; }
  .asset-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .nav-search input { width: 160px; }
}
</style>
</head>
<body>

<nav>
  <div class="logo">ASIT<em>Management</em></div>
  <div class="nav-spacer"></div>
  <div class="nav-search">
    <span class="search-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <input type="text" id="search" placeholder="Cari aset..." oninput="render()">
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-grid" onclick="setView('grid')" title="Grid view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="view-btn" id="btn-list" onclick="setView('list')" title="List view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
    </button>
  </div>
</nav>

<section class="header">
  <div>
    <h1 class="header-title">ASIT<br><em>Management</em></h1>
    <p class="header-sub">Inventaris terpusat · Lacak kondisi & kepemilikan aset</p>
  </div>
</section>

<div class="stats-row" id="stats"></div>

<div class="filter-bar">
  <div class="chip active" onclick="setFilter(this,'')">Semua</div>
  <div class="chip" onclick="setFilter(this,'Aktif')">Aktif</div>
  <div class="chip" onclick="setFilter(this,'Maintenance')">Maintenance</div>
  <div class="chip" onclick="setFilter(this,'Retired')">Retired</div>
</div>

<div class="grid-container" id="grid-container"></div>

<footer>ASIT Management</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="assets.js"></script>
<script>
let activeFilter = '';
let currentView = 'grid';

function setFilter(el, val) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFilter = val;
  render();
}

function setView(v) {
  currentView = v;
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  render();
}

function statusClass(s) {
  return { 'Aktif':'s-aktif', 'Maintenance':'s-maintenance', 'Retired':'s-retired' }[s] || 's-aktif';
}
function badgeClass(s) {
  return { 'Aktif':'badge-aktif', 'Maintenance':'badge-maintenance', 'Retired':'badge-retired' }[s] || 'badge-aktif';
}

function imgContent(asset, large) {
  if (asset.img) {
    return `<img src="${asset.img}" alt="${asset.name}" onerror="this.parentElement.textContent='📦'">`;
  }
  const map = { laptop:'💻', printer:'🖨', ac:'❄️', proyektor:'📽', iphone:'📱', meja:'🪑', monitor:'🖥', kamera:'📷' };
  const n = asset.name.toLowerCase();
  for (const [k,v] of Object.entries(map)) if (n.includes(k)) return v;
  return '📦';
}

function renderGrid(list) {
  if (!list.length) {
    return `<div class="asset-grid"><div class="empty"><div class="empty-icon">🔍</div><p>Tidak ada aset ditemukan.</p></div></div>`;
  }
  const cards = list.map(a => `
    <a class="asset-card" href="detail.html?id=${a.id}" title="${a.name}">
      <div class="card-img">
        ${imgContent(a)}
        <span class="card-status ${statusClass(a.status)}">${a.status}</span>
      </div>
      <div class="card-body">
        <div class="card-no">${a.no}</div>
        <div class="card-name">${a.name}</div>
        <div class="card-meta">
          <div class="card-owner">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            ${a.owner}
          </div>
          ${a.dept ? `<div class="card-dept">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
            ${a.dept}
          </div>` : ''}
        </div>
        ${(a.tags||[]).length ? `<div class="card-tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-loc">
          ${a.location ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:4px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>${a.location}` : '—'}
        </span>
        <span class="card-arrow">→</span>
      </div>
    </a>
  `).join('');
  return `<div class="asset-grid">${cards}</div>`;
}

function renderList(list) {
  if (!list.length) return `<div class="empty"><div class="empty-icon">🔍</div><p>Tidak ada aset ditemukan.</p></div>`;
  return `<div class="asset-list">${list.map(a => `
    <a class="list-item" href="detail.html?id=${a.id}">
      <div class="list-thumb">${imgContent(a)}</div>
      <div class="list-info">
        <div class="list-name">${a.name}</div>
        <div class="list-sub">${a.owner}${a.dept ? ' · ' + a.dept : ''}</div>
      </div>
      <div class="list-right">
        <span class="list-loc">${a.location || '—'}</span>
        <span class="badge ${badgeClass(a.status)}">${a.status}</span>
        <span class="list-arrow">→</span>
      </div>
    </a>
  `).join('')}</div>`;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = ASSETS.filter(a => {
    const mQ = !q || [a.name,a.no,a.owner,a.dept,a.location].some(x=>x&&x.toLowerCase().includes(q));
    const mF = !activeFilter || a.status === activeFilter;
    return mQ && mF;
  });

  const container = document.getElementById('grid-container');
  container.innerHTML = currentView === 'grid' ? renderGrid(filtered) : renderList(filtered);

  anime({
    targets: currentView === 'grid' ? '.asset-card' : '.list-item',
    opacity: [0,1],
    translateY: [16, 0],
    delay: anime.stagger(50, { start: 0 }),
    duration: 450,
    easing: 'easeOutExpo'
  });
}

function renderStats() {
  const total = ASSETS.length;
  const aktif = ASSETS.filter(a=>a.status==='Aktif').length;
  const maint = ASSETS.filter(a=>a.status==='Maintenance').length;
  const ret   = ASSETS.filter(a=>a.status==='Retired').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-n" id="sn-t">0</div><div class="stat-l">Total Aset</div></div>
    <div class="stat-card"><div class="stat-n c-green" id="sn-a">0</div><div class="stat-l">Aktif</div></div>
    <div class="stat-card"><div class="stat-n c-amber" id="sn-m">0</div><div class="stat-l">Maintenance</div></div>
    <div class="stat-card"><div class="stat-n c-red" id="sn-r">0</div><div class="stat-l">Retired</div></div>
  `;

  [['sn-t',total],['sn-a',aktif],['sn-m',maint],['sn-r',ret]].forEach(([id,val]) => {
    anime({ targets:{v:0}, v:val, round:1, duration:1000, easing:'easeOutExpo',
      update(a){ const el=document.getElementById(id); if(el) el.textContent=Math.round(a.animations[0].currentValue); }
    });
  });
}

window.addEventListener('DOMContentLoaded', () => {
  render();
  renderStats();
  document.body.style.opacity = '1';

  anime.timeline({ easing: 'easeOutExpo' })
    .add({ targets: 'nav', translateY: [-10,0], opacity:[0,1], duration: 500 }, 0)
    .add({ targets: '.header-title', translateY:[24,0], opacity:[0,1], duration: 700 }, 100)
    .add({ targets: '.header-sub', opacity:[0,1], duration:400 }, 350)
    .add({ targets: '.stat-card', translateY:[10,0], opacity:[0,1], delay:anime.stagger(60), duration:500 }, 400)
    .add({ targets: '.filter-bar', opacity:[0,1], translateY:[6,0], duration:400 }, 600)
    .add({ targets: '#grid-container', opacity:[0,1], duration:300 }, 700);
});
</script>
</body>
</html>
